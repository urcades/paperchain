name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:conformance:ts
      - run: python3 -m unittest conformance.python.test_corpus
      - run: npm run test:conformance:python
      - run: npm run build
